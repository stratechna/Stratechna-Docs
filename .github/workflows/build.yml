name: Build Stratechna Docs

# Sem rebuild agendado: a versão do Paperless está fixa no Dockerfile e só muda
# de propósito. O workflow upstream.yml abre um issue quando sai versão nova.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEM: ghcr.io/stratechna/stratechna-docs
  # Nome antigo, ainda publicado em paralelo durante a transição
  IMAGEM_LEGACY: ghcr.io/stratechna/stratechna-vault

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Versão fixada do Paperless
        id: v
        run: |
          V=$(sed -nE 's/^ARG PAPERLESS_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)
          test -n "$V" || { echo "PAPERLESS_VERSION não encontrada no Dockerfile"; exit 1; }
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"

      - name: Build (o aplicar.py falha se alguma troca deixar de encaixar)
        run: docker build --pull -t docs:teste --label org.opencontainers.image.revision=${{ github.sha }} .

      - name: Verificar a marca na imagem construída
        run: bash branding/verificar.sh docs:teste

      - name: Publicar (só chega aqui se a verificação passou)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in "$IMAGEM" "$IMAGEM_LEGACY"; do
            for tag in ${{ steps.v.outputs.versao }} ${{ steps.v.outputs.minor }} latest; do
              docker tag docs:teste "$img:$tag"
              docker push -q "$img:$tag"
            done
          done
